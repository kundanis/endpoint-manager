    <title>Endpoint Manager — PII Attachment Guard</title>

    <!-- commands.js is served by the server with JSZip (vendor/jszip.min.js) and the server's
         base URL bundled in — classic Outlook on Windows loads only that one file, so the
         web/new-Outlook path loads the same bundle rather than a separate JSZip tag. -->
    <script src="commands.js"></script>
  </head>

         this page's scripts in a hidden runtime purely to run onMessageSendHandler. -->
  </body>
