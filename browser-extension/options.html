<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Endpoint IQ Mail Guard</title>
    <style>
      body { font: 14px/1.5 Arial, sans-serif; margin: 24px; max-width: 560px; color: #1f1f1f; }
      h1 { font-size: 18px; margin: 0 0 4px; }
      p { color: #555; margin: 0 0 16px; }
      .managed { background: #f2f2f2; padding: 8px 12px; border-radius: 6px; }

  <body>
    <h1>Endpoint IQ Mail Guard</h1>

    <div id="status" class="managed" role="status">Checking connection…</div>
