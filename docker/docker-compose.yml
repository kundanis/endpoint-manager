# Endpoint IQ - one-command deployment (server + console + SQL Server).
#
#   cd docker
#   ./deploy-ec2.sh          # EC2/Linux: installs Docker, generates .env secrets, starts it
#   # or manually:
#   cp .env.example .env     # then edit secrets in .env
#   docker compose up -d --build
#
# The server auto-creates the database, applies migrations and seeds the first admin on start
# (idempotent, safe to restart). Open http://<host>:4000 and sign in with ADMIN_EMAIL /
# ADMIN_PASSWORD, then set Enrollment Tokens -> Server connection details.
#
# NOTE: Remote agent install and server-side network scan are unavailable in the Linux image
# (they need Windows/WinRM) - install agents with the downloadable setup exe instead.

services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    # SQL Server images are x86_64 only - use an x86 EC2 type (t3/m6i/m7i), not Graviton.
    platform: linux/amd64
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SA_PASSWORD:?set SA_PASSWORD in .env}
      MSSQL_PID: Express
    volumes:
      - mssql-data:/var/opt/mssql
    # Not published to the host by default - only the server container needs it. Uncomment to
    # connect an external SQL client for debugging.
    # ports:
    #   - "1433:1433"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -No -Q 'SELECT 1' || /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  server:
    # `up --build` builds this tag from the repo; without --build an already-loaded image
    # (e.g. `docker load -i endpoint-one-server.tar.gz`) is used as-is.
    image: endpoint-one-server:latest
    build:
      context: ..
      dockerfile: docker/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: "4000"
      # sa for the bundled DB. The server creates the DB on first start (via MASTER_DATABASE_URL).
      DB_NAME: ${DB_NAME:-EndpointManagerDb}
      DATABASE_URL: "sqlserver://db:1433;database=${DB_NAME:-EndpointManagerDb};user=sa;password=${SA_PASSWORD};encrypt=true;trustServerCertificate=true"
      MASTER_DATABASE_URL: "sqlserver://db:1433;database=master;user=sa;password=${SA_PASSWORD};encrypt=true;trustServerCertificate=true"
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      FIELD_ENCRYPTION_KEY: ${FIELD_ENCRYPTION_KEY:?set FIELD_ENCRYPTION_KEY in .env}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@endpointone.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD in .env}
      LICENSE_ENFORCEMENT_ENABLED: ${LICENSE_ENFORCEMENT_ENABLED:-false}
      # Optional extra: advanced application control (Windows AppLocker). "true" to offer it.
      ADVANCED_APP_CONTROL: ${ADVANCED_APP_CONTROL:-false}
      # Public IPs/CIDRs allowed to open the admin console (private networks always are).
      ADMIN_ALLOWED_NETWORKS: ${ADMIN_ALLOWED_NETWORKS:-}
      # "cloudflare" when published through Cloudflare's proxy (orange cloud) - see INSTALL.md.
      TRUSTED_PROXY: ${TRUSTED_PROXY:-}
      # HTTPS: put server.pfx in docker/certs/ and set TLS_PFX_PATH=/app/certs/server.pfx +
      # TLS_PFX_PASSPHRASE in .env. HTTPS on 4443 (published as HTTPS_PORT, default 443);
      # plain HTTP stays on 4000 for agents. Ignored when no certificate is configured.
      TLS_PFX_PATH: ${TLS_PFX_PATH:-}
      TLS_PFX_PASSPHRASE: ${TLS_PFX_PASSPHRASE:-}
      TLS_CA_CHAIN_PATH: ${TLS_CA_CHAIN_PATH:-}
      TLS_PORT: "4443"
    ports:
      - "4000:4000"
      - "${HTTPS_PORT:-443}:4443"
    volumes:
      - uploads:/app/uploads
      # Place built agent installers here so Console -> Download agent installer works.
      - ./agent-installer:/app/agent-installer
      - ./certs:/app/certs:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      # First start creates the DB, migrates and seeds - give it time.
      start_period: 120s

volumes:
  mssql-data:
  uploads:
