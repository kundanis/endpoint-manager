# Endpoint IQ - customer deployment (prebuilt image only, no source code).
#
# Installed to /opt/endpoint-one by deploy.sh, which also writes .env (secrets + APP_VERSION).
# Manage with:  cd /opt/endpoint-one && docker compose <ps|logs -f server|restart|down>
#
# The project name is pinned so the data volumes keep the same names across upgrades, no
# matter which folder a new release bundle was extracted to.
name: endpoint-one

services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    # SQL Server images are x86_64 only.
    platform: linux/amd64
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SA_PASSWORD:?set SA_PASSWORD in .env}
      # Express is free (10 GB per database). Set MSSQL_PID=Standard in .env if licensed.
      MSSQL_PID: ${MSSQL_PID:-Express}
    volumes:
      - mssql-data:/var/opt/mssql
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -No -Q 'SELECT 1' || /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  server:
    # Loaded from the release bundle (docker load); never built on the customer's server.
    image: endpoint-one-server:${APP_VERSION:?set APP_VERSION in .env}
    pull_policy: never
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: "4000"
      DB_NAME: ${DB_NAME:-EndpointManagerDb}
      # The server runs as the restricted login APP_DB_USER (read/write/execute on this database
      # only - created by the container's start-up). sa is used only to create the database,
      # apply migrations and create that login, and is removed from the server's environment
      # before it starts.
      APP_DB_USER: ${APP_DB_USER:-endpoint_app}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?set APP_DB_PASSWORD in .env}
      DATABASE_URL: "sqlserver://db:1433;database=${DB_NAME:-EndpointManagerDb};user=${APP_DB_USER:-endpoint_app};password=${APP_DB_PASSWORD};encrypt=true;trustServerCertificate=true"
      MIGRATE_DATABASE_URL: "sqlserver://db:1433;database=${DB_NAME:-EndpointManagerDb};user=sa;password=${SA_PASSWORD};encrypt=true;trustServerCertificate=true"
      MASTER_DATABASE_URL: "sqlserver://db:1433;database=master;user=sa;password=${SA_PASSWORD};encrypt=true;trustServerCertificate=true"
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      FIELD_ENCRYPTION_KEY: ${FIELD_ENCRYPTION_KEY:?set FIELD_ENCRYPTION_KEY in .env}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@endpointone.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD in .env}
      LICENSE_ENFORCEMENT_ENABLED: ${LICENSE_ENFORCEMENT_ENABLED:-false}
      # Optional extra: advanced application control (Windows AppLocker). "true" to offer it.
      ADVANCED_APP_CONTROL: ${ADVANCED_APP_CONTROL:-false}
      # "threat-protection" = the separate Endpoint IQ Threat Protection edition; "full" = Endpoint IQ.
      PRODUCT_EDITION: ${PRODUCT_EDITION:-full}
      # Threat Protection (Microsoft Defender management) on a full install whose licence enforcement is off.
      THREAT_PROTECTION: ${THREAT_PROTECTION:-false}
      # Public IPs/CIDRs allowed to open the admin console (private networks always are).
      ADMIN_ALLOWED_NETWORKS: ${ADMIN_ALLOWED_NETWORKS:-}
      # "cloudflare" when published through Cloudflare's proxy (orange cloud) - see INSTALL.md.
      TRUSTED_PROXY: ${TRUSTED_PROXY:-}
      # HTTPS (set by `deploy.sh --install-cert`). With a certificate installed the server
      # serves HTTPS on 4443 (published as HTTPS_PORT, default 443) and keeps plain HTTP on
      # 4000 for agents only, so agents enrolled with an http:// address keep checking in -
      # browsers opening the HTTP address are redirected to HTTPS. Without one, only HTTP on
      # 4000 is served (console included) and these are ignored.
      TLS_PFX_PATH: ${TLS_PFX_PATH:-}
      TLS_PFX_PASSPHRASE: ${TLS_PFX_PASSPHRASE:-}
      TLS_CA_CHAIN_PATH: ${TLS_CA_CHAIN_PATH:-}
      TLS_PORT: "4443"
      # Where browsers that land on the plain-HTTP port are redirected (the published HTTPS
      # port). With a certificate, the HTTP port serves agents only.
      HTTPS_PUBLIC_PORT: ${HTTPS_PORT:-443}
    ports:
      - "${APP_PORT:-4000}:4000"
      - "${HTTPS_PORT:-443}:4443"
    volumes:
      - uploads:/app/uploads
      # Read-only: the server only serves these files, it never writes them.
      - ./agent-installer:/app/agent-installer:ro
      - ./certs:/app/certs:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 120s

volumes:
  mssql-data:
  uploads:
